[package]
name = "nova-egui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "=0.36.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "=0.12.2"
walkdir = "2.5"
tempfile = "3"

[[bin]]
name = "nova-egui"
path = "src/main.rs"
